services:
  - type: web
    name: passo-caminhadas
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DB_HOST
        fromDatabase:
          name: passo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: passo-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: passo-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: passo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: passo-db
          property: password
      - key: APP_SECURITY_USERNAME
        sync: false
      - key: APP_SECURITY_PASSWORD
        sync: false

databases:
  - name: passo-db
    databaseName: passodb
    user: passouser
    plan: free